# Install and uninstall on a fresh runner with both agent CLIs, so a CLI or upstream change shows up here first.
name: install
on: [push, pull_request, workflow_dispatch]
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6, for the skill scan in 90-check.sh
      - name: Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: sh scripts/install.sh full
        env: { LAK_GITHUB_ISSUES: "yes", LAK_JIRA: "yes", LAK_JIRA_SITES: "https://example.atlassian.net=DEMO" }
      - name: Optional skills installed, Jira sites saved, no token
        run: |
          test -f ~/.agents/skills/issues-github/SKILL.md
          test -f ~/.agents/skills/issues-jira/SKILL.md
          grep -qx "jira_sites=https://example.atlassian.net=DEMO" ~/.leanagentkit/tracking.conf
          if grep -qi token ~/.leanagentkit/tracking.conf; then echo "tracking.conf holds a token"; exit 1; fi
      - name: Rerun without LAK_* keeps the saved choice
        run: sh scripts/install.sh 85-tracking.sh && test -f ~/.agents/skills/issues-github/SKILL.md && test -f ~/.agents/skills/issues-jira/SKILL.md
      - name: Declining removes the optional skills
        run: sh scripts/install.sh 85-tracking.sh && test ! -e ~/.agents/skills/issues-github && test ! -e ~/.agents/skills/issues-jira
        env: { LAK_GITHUB_ISSUES: "no", LAK_JIRA: "no" }
      - name: Reinstall, then uninstall removes the optional skills
        run: sh scripts/install.sh 85-tracking.sh && sh scripts/uninstall.sh && test ! -e ~/.agents/skills/issues-github && test ! -e ~/.agents/skills/issues-jira && test ! -e ~/.leanagentkit/tracking.conf
        env: { LAK_GITHUB_ISSUES: "yes", LAK_JIRA: "yes" }
